[project]
name = "agent-harness-lab"
version = "0.1.0"
description = "Companion code for the Edge of Context series on agent harnesses."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = [
    "langchain==1.4.2",
    "langgraph==1.2.12",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.6.5",
    "langchain-openrouter==0.2.9",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.0",
    # τ³-bench (package name tau2), pinned to commit b7ea907 (v1.0.1 + 46 commits).
    "tau2 @ git+https://github.com/sierra-research/tau2-bench@b7ea9074c1cba482b30687fecdb5c8425fd6f619",
    "langchain-typesafe[experimental]==0.0.1a3",
    # The evaluator (evaluator/) and the improvement loop (loop/); pinned in [tool.uv.sources].
    "harness-evals",
    "harness-loop",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.uv.sources]
harness-evals = { git = "https://github.com/slavadubrov/harness-evals", rev = "4a63be083ba2a7e11f14605a4b966a07f22d5bcf" }
harness-loop = { git = "https://github.com/slavadubrov/harness-loop", rev = "2cdebfb8b6dc2cd321f56a70422bbada7b84cd4c" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# reports/part-5 holds candidates exactly as an improver wrote them.
extend-exclude = [".cache", "build", "reports/part-5"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["harness", "envs", "evaluator"]
