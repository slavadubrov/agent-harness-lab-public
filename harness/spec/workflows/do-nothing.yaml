# A baseline that does nothing: no model call, no write and no reply. It passes every task
# whose check expects no change, so it shows how much a check of the database alone passes.
kind: workflow
name: a3-do-nothing
description: No model call, no write and no reply.
engine: {name: langgraph}
state_schema: envs.custom.approval:CaseState
context_schema: envs.custom.tools:AccountContext

nodes:
  nothing:
    type: function
    ref: envs.custom.code_workflow:do_nothing

edges:
  - [START, nothing]
  - [nothing, END]
