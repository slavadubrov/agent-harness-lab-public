# The support tasks with no agent. One model call reads the message into typed fields;
# code does the rest: regular expressions, the policy rules, the writes and a template
# reply. A refund above $200 goes to the same approval steps as refund-approval.yaml.
# Functions: envs/custom/code_workflow.py and envs/custom/approval.py.
kind: workflow
name: a2-code
description: One structured model call, then code for the checks, the writes and the reply.
engine: {name: langgraph}
state_schema: envs.custom.code_workflow:CodeCase
context_schema: envs.custom.tools:AccountContext

nodes:
  read:
    type: structured
    model:
      provider: openrouter
      id: openai/gpt-6-luna
      settings:
        max_tokens: 1024
        reasoning: {effort: low}
        provider: {order: [openai], allow_fallbacks: false}
        timeout_ms: 120000
        max_retries: 2
    output_schema: envs.custom.code_workflow:Request
    prompt: |
      Read this message to an online shop's customer support and fill in the fields.

      {request}
    writes: {kind: kind, amount_cents: amount_cents, address: address, settings: settings}
  handle:
    type: function
    ref: envs.custom.code_workflow:handle
    # Safe to retry: the refund service deduplicates by operation key.
    retry: {max_attempts: 3, initial_interval: 0.5, retry_on: ["builtins:ConnectionError"]}
  find_held:
    type: function
    ref: envs.custom.approval:find_held
  approval:
    type: function
    ref: envs.custom.approval:wait_for_supervisor
  issue:
    type: function
    ref: envs.custom.approval:issue_approved
    retry: {max_attempts: 3, initial_interval: 0.5, retry_on: ["builtins:ConnectionError"]}
  reply:
    type: function
    ref: envs.custom.approval:reply

edges:
  - [START, read]
  - [read, handle]
  - [handle, find_held]
  - [approval, issue]
  - [issue, reply]
  - [reply, END]
conditional_edges:
  - source: find_held
    field: next_step
    routes: {approval: approval}
    default: END
