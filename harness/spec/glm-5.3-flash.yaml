# base.yaml with one change: the model.
# Friendli endpoint: Z.AI's own endpoint accepts only tool_choice=auto, so it cannot
# force the SGR NextStep call.
extends: base.yaml
name: a1-base-glm-5.3-flash
model:
  id: z-ai/glm-5.3-flash
  settings:
    provider: {order: [friendli], allow_fallbacks: false}
