<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="one-task-title one-task-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="one-task-title">How one custom task runs</title><desc id="one-task-desc">A customer message starts the run. The model node picks the next step; with Schema-Guided Reasoning it returns one typed NextStep object, either a tool call or a reply. A tool call goes to the tools node, where the Jev guard checks the three write tools before the tool reads or writes the SQLite database or looks up policy through the MCP server. The result goes back to the model. When the model replies, the run ends and a state check compares the final database with the change the task expects. The check does not read the reply text.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="one-task-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="one-task-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="720" height="800" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">How one custom task runs</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">The model picks each step. Code runs the tools and checks the final database.</text>
