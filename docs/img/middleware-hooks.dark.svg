<path d="M32 768h656" stroke="#2B3B33" stroke-width="1"/>
<text x="32" y="794" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Hooks as implemented in langchain 1.4.2 and langchain-typesafe 0.0.1a3.</text>
<text x="32" y="816" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">base.yaml order, outermost first: summarization, call limit, tool retry, Jev, SGR.</text>
