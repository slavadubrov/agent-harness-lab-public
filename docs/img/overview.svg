<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 824" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="overview-title overview-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="overview-title">How the demo fits together</title><desc id="overview-desc">A YAML spec file lists the model, prompt, tools, middleware and checkpointer. build_harness in harness/agent.py validates it and calls LangChain create_agent, which returns one agent. Two environments run that agent: the custom support tasks, twelve tasks each on a fresh SQLite database, and the tau-cubed-bench retail subset, eight tasks with a simulated customer. Both check the final database and write results.jsonl, traces.jsonl and run.json under reports/article-a1, which scripts/report_a1.py turns into the report tables.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="overview-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="overview-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="720" height="824" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">How the demo fits together</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">One YAML spec builds one LangChain agent. Two environments run it and record the results.</text>
