<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="middleware-hooks-title middleware-hooks-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="middleware-hooks-title">Where the five middleware components of the A1 harness run</title><desc id="middleware-hooks-desc">The create_agent graph has a model node and a tools node. Summarization, the model call limit and Schema-Guided Reasoning hook into the model node, so they run in both environments. Tool retry and the Jev write guard wrap tool execution in the tools node. Under tau-cubed-bench the graph stops before the tools node and tau-cubed-bench runs the tool calls itself, so those two components never run there.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="middleware-hooks-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="middleware-hooks-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="720" height="840" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Where each middleware component runs</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Model-side hooks run everywhere. Tool-side hooks run only when the harness runs the tools.</text>
<rect x="32" y="112" width="280" height="408" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="48" y="138" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">MODEL NODE</text>
<path d="M58 156h228a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-228a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M58 156h228a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-248a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="62" y="173.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">BUILT IN</text><text x="62" y="207" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Summarization</text><text x="62" y="229" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">before_model</text><text x="62" y="249" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">trigger: 12,000 tokens</text>
<path d="M58 276h228a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-228a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M58 276h228a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-248a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="62" y="293.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">BUILT IN</text><text x="62" y="327" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Model call limit</text><text x="62" y="349" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">before_model + after_model</text><text x="62" y="369" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">20 model calls per run</text>
<path d="M58 396h228a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-228a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M58 396h228a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-248a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="62" y="413.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">CUSTOM</text><text x="62" y="447" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Schema-Guided Reasoning</text><text x="62" y="469" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">wrap_model_call</text><text x="62" y="489" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">one typed NextStep per call</text>
<rect x="408" y="112" width="280" height="288" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="424" y="138" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">TOOLS NODE</text>
<path d="M434 156h228a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-228a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M434 156h228a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-248a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="438" y="173.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">BUILT IN</text><text x="438" y="207" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Tool retry</text><text x="438" y="229" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">wrap_tool_call</text><text x="438" y="249" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">2 retries on a tool error</text>
<path d="M434 276h228a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-228a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M434 276h228a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-248a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="438" y="293.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">LANGCHAIN-TYPESAFE</text><text x="438" y="327" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Jev write guard</text><text x="438" y="349" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">wrap_tool_call</text><text x="438" y="369" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">blocks a write at p ≥ 0.5</text>
<path d="M312 208H408" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#middleware-hooks-arrow-flow)"/><rect x="313" y="196" width="94" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1"/><text x="360" y="212.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">tool calls</text>
<path d="M408 344H312" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#middleware-hooks-arrow-flow)"/><rect x="324" y="332" width="72" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1"/><text x="360" y="348.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">results</text>
<path d="M172 520V624" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#middleware-hooks-arrow-flow)"/><rect x="52" y="560" width="240" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1"/><text x="172" y="576.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">τ³: tool calls leave the graph</text>
<path d="M42 624h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/><path d="M42 624h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E"/><text x="46" y="641.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCUS · Τ³ ENVIRONMENT</text><text x="46" y="675" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">τ³-bench runs the tool calls itself</text><text x="46" y="697" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">interrupt_before=["tools"] pauses the graph before the tools node</text><text x="46" y="717" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Tool retry and the Jev guard never run there; the model-side three do</text>
<path d="M32 768h656" stroke="#D8DDD9" stroke-width="1"/>
<text x="32" y="794" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Hooks as implemented in langchain 1.4.2 and langchain-typesafe 0.0.1a3.</text>
<text x="32" y="816" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">base.yaml order, outermost first: summarization, call limit, tool retry, Jev, SGR.</text>
