# The support assistant with no agent. One model call reads the message into typed
# fields; code does the rest: regular expressions, the policy rules, the writes and a
# template reply. A refund above $200 goes to the environment's approval steps.
# Functions of this harness: support_steps.py, next to this file.
kind: workflow
name: support
description: One structured model call, then code for the checks, the writes and the reply.
engine: {name: langgraph}
state_schema: support_steps:CodeCase
context_schema: envs.custom.tools:AccountContext

nodes:
  read:
    type: structured
    # The frozen model. Every model call of this harness must use exactly this block.
    model: {provider: import, id: openai, ref: "harness.openai_model:chat"}
    method: json_schema
    output_schema: support_steps:Request
    prompt: |
      Read this message to an online shop's customer support and fill in the fields.
      Use policy for questions about general shop rules or hypothetical eligibility,
      even if the customer includes their email or mentions their own circumstances.
      Select the relevant policy topics. Policy is not an account or order lookup.
      Use refund, address or preferences when the customer actually asks you to make
      that change, even if the request is phrased as a question. A question about
      whether an existing refund went through is not a request for a new refund.
      For a refund request with no order number, copy the specific product phrase
      the customer wants refunded into refund_item. Do not infer a product from a
      symptom or part alone. Leave refund_item empty if more than one product is
      being requested for refund or the intended target is unclear.

      Customer message:
      {request}
    writes: {kind: kind, policy_topics: policy_topics, amount_cents: amount_cents, refund_item: refund_item, address: address, settings: settings}
  handle:
    type: function
    ref: support_steps:handle
    # Safe to retry: the refund service deduplicates by operation key.
    retry: {max_attempts: 3, initial_interval: 0.5, retry_on: ["builtins:ConnectionError"]}
  find_held:
    type: function
    ref: envs.custom.approval:find_held
  approval:
    type: function
    ref: envs.custom.approval:wait_for_supervisor
  issue:
    type: function
    ref: envs.custom.approval:issue_approved
    retry: {max_attempts: 3, initial_interval: 0.5, retry_on: ["builtins:ConnectionError"]}
  reply:
    type: function
    ref: envs.custom.approval:reply

edges:
  - [START, read]
  - [read, handle]
  - [approval, issue]
  - [issue, reply]
  - [reply, END]
conditional_edges:
  - source: handle
    field: kind
    routes: {policy: END}
    default: find_held
  - source: find_held
    field: next_step
    routes: {approval: approval}
    default: END
